name: Feature request
description: Propose a new helper or an improvement to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard with the current API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Function name, signature, return kind, and an example call with the expected result.
      render: ts
    validations:
      required: true
  - type: textarea
    id: edge-cases
    attributes:
      label: Edge cases and error behavior
      description: Invalid input, boundaries, Unicode, time zones or precision limits that matter.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: I understand the library has no runtime dependencies and is pure and platform-neutral by default.
          required: true
