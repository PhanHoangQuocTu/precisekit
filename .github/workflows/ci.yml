name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only token for every job. Jobs that need more must declare it themselves.
permissions:
  contents: read

# A newer run for the same ref supersedes an older, still running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All third-party actions are pinned to a full commit SHA; the trailing comment is the
# release the SHA belongs to. Dependabot (github-actions ecosystem) keeps both in sync.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build toolchain (tsup 9) needs Node >= 22.18. "22" resolves to the newest 22.x,
      # which satisfies that. The published package itself still supports Node >= 18; that is
      # exercised by the `compatibility` job below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node --test scripts/verify-release-registry.test.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run docs:sync
      - name: Generated documentation must already be synchronized
        run: git diff --exit-code -- docs README.md .github/repository-metadata.json
      - run: npm run test:package
      - run: npm run test:docs
      - run: npm run test:site
      - run: npm audit --audit-level=low --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  packed-consumers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: npm ci
      - run: npm run build
      - run: npm run test:bun
      - run: npm run test:tarball

  # Loads the already-built dist on every supported Node.js line. These jobs deliberately
  # do NOT run `npm ci` or build: the toolchain does not run on Node 18/20, and the point is
  # to prove the published output does.
  compatibility:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Load the built package on this Node.js version
        run: node scripts/verify-package.mjs
