name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run docs:sync
      - name: Generated documentation must already be synchronized
        run: git diff --exit-code -- docs README.md .github/repository-metadata.json
      - run: npm run test:package
      - run: npm run test:docs
      - run: npm run test:site
      - run: npm audit --audit-level=low --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  packed-consumers:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: npm ci
      - run: npm run build
      - run: npm run test:bun
      - run: npm run test:tarball

  compatibility:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Load the built package on this Node.js version
        run: node scripts/verify-package.mjs
